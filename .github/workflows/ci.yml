name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The plugin ships the bundled server and the builder skill's checker, so the committed copies must match this build.
      - run: test -z "$(git status --porcelain plugins/claude-code)" || { git status --short plugins/claude-code; echo 'Run npm run build and commit plugins/claude-code'; exit 1; }

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: foundry-rs/foundry-toolchain@v1
      # Deterministic tests use fresh local state and must not inherit live account balances.
      - name: Deterministic contract tests (no RPC)
        run: forge test --no-match-contract AgentSwapTest
      # AgentSwap swaps on the real Uniswap v4 pool. Pin a few blocks back so load-balanced RPCs agree.
      - name: AgentSwap Sepolia fork regressions
        run: forge test --match-contract AgentSwapTest --fork-url "$RPC" --fork-block-number $(( $(cast block-number --rpc-url "$RPC") - 5 ))
        env:
          RPC: https://ethereum-sepolia-rpc.publicnode.com
