name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # The plugin ships the bundled server, so the committed copy must match this build.
      - run: test -z "$(git status --porcelain plugins/claude-code/server)" || { git status --short plugins/claude-code/server; echo 'Run npm run build and commit plugins/claude-code/server'; exit 1; }

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: foundry-rs/foundry-toolchain@v1
      # Tests fork Sepolia to swap on the real Uniswap v4 pool. Pinned a few blocks back so load-balanced RPCs agree.
      - run: forge test --fork-url "$RPC" --fork-block-number $(( $(cast block-number --rpc-url "$RPC") - 5 ))
        env:
          RPC: https://ethereum-sepolia-rpc.publicnode.com
