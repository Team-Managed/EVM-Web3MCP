[profile.default]
src = "src"
test = "test"
out = "out"
solc = "0.8.28"
evm_version = "cancun"
# GiftBox is built with the optimizer and via-IR; everything else keeps the defaults AgentSwap was deployed with.
additional_compiler_profiles = [{ name = "giftbox", optimizer = true, optimizer_runs = 200, via_ir = true }]
compilation_restrictions = [{ paths = "src/GiftBox.sol", min_optimizer_runs = 200, max_optimizer_runs = 200, via_ir = true }]
